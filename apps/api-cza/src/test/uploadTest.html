<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload API Tester</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .form-input bg-gray-600 text-white rounded p-2 { @apply w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md shadow-sm text-gray-200 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500; }
        .btn { @apply w-full px-4 py-2 font-semibold text-white rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800; }
        .btn-primary { @apply bg-blue-600 hover:bg-blue-700; }
        .btn-secondary { @apply bg-indigo-600 hover:bg-indigo-700; }
        .disabled-btn { @apply bg-gray-500 cursor-not-allowed; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100">

    <div class="container mx-auto p-4 md:p-8">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-white">File Upload API Tester</h1>
            <p class="text-gray-400 mt-2">Log in and upload files to the protected endpoint.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="p-4 bg-gray-800 rounded-lg shadow-md">
                <label for="user-api-url" class="block text-sm font-medium text-gray-300 mb-2">User API Base URL</label>
                <input type="text" id="user-api-url" class="form-input bg-gray-600 text-white rounded p-2" value="http://localhost:4000/api/users">
            </div>
            <div class="p-4 bg-gray-800 rounded-lg shadow-md">
                <label for="file-api-url" class="block text-sm font-medium text-gray-300 mb-2">File API Base URL</label>
                <input type="text" id="file-api-url" class="form-input bg-gray-600 text-white rounded p-2" value="http://localhost:4000/api/files">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="space-y-8">
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                    <h2 class="text-xl font-bold mb-4">1. Login First</h2>
                    <form id="login-form" class="space-y-4">
                        <input type="email" id="login-email" class="form-input bg-gray-600 text-white rounded p-2" placeholder="Email (admin or editor)" required value="editor@example.com">
                        <input type="password" id="login-password" class="form-input bg-gray-600 text-white rounded p-2" placeholder="Password" required value="PasswordEditor456!">
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                </div>
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                    <h3 class="text-lg font-semibold mb-3">Current State</h3>
                    <div class="space-y-2">
                         <div>
                            <label class="text-sm font-medium text-gray-400">Logged in User ID:</label>
                            <p id="user-id-display" class="text-xs text-cyan-400 break-all bg-gray-700 p-2 rounded">- Not logged in -</p>
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-400">Access Token:</label>
                            <p id="access-token-display" class="text-xs text-green-400 break-all bg-gray-700 p-2 rounded">- Not set -</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                <h2 class="text-xl font-bold mb-4">2. Upload File</h2>
                <form id="upload-form" class="space-y-4">
                    <div>
                        <label for="file-input" class="block text-sm font-medium text-gray-300 mb-1">Select File*</label>
                        <input type="file" id="file-input" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-500 file:text-white hover:file:bg-blue-600" required>
                    </div>
                    <input type="text" id="upload-uniqueId" class="form-input bg-gray-600 text-white rounded p-2" placeholder="Unique ID (e.g., a hash)*" required>
                    <input type="text" id="upload-projectId" class="form-input bg-gray-600 text-white rounded p-2 " placeholder="Project ID*" required>
                    <input type="text" id="upload-createdBy" class="form-input bg-gray-600 text-white rounded p-2" placeholder="Created By (auto-filled on login)" readonly required>
                    
                    <div>
                        <label for="upload-fileType" class="block text-sm font-medium text-gray-300 mb-1">File Type*</label>
                        <select id="upload-fileType" class="form-input bg-gray-600 text-white rounded p-2" required>
                            <option value="image">Image</option>
                            <option value="ifc">IFC</option>
                        </select>
                    </div>

                    <button type="submit" id="upload-btn" class="btn btn-secondary disabled-btn" disabled>Upload File</button>
                </form>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-8">
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                <h2 class="text-xl font-bold mb-4">Recent Uploads</h2>
                <ul id="uploads-list" class="space-y-2 text-sm">
                    <li class="text-gray-500">No files uploaded yet.</li>
                </ul>
            </div>
             <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                <h2 class="text-xl font-bold mb-4">API Response</h2>
                <pre id="api-response" class="bg-black text-xs p-4 rounded-md overflow-x-auto whitespace-pre-wrap">Login to begin.</pre>
            </div>
        </div>
    </div>

    <script>
        // --- State and DOM Elements ---
        const userApiUrl = document.getElementById('user-api-url');
        const fileApiUrl = document.getElementById('file-api-url');
        const responseEl = document.getElementById('api-response');
        const accessTokenDisplay = document.getElementById('access-token-display');
        const userIdDisplay = document.getElementById('user-id-display');
        const uploadBtn = document.getElementById('upload-btn');
        const createdByInput = document.getElementById('upload-createdBy');
        const uploadsList = document.getElementById('uploads-list');
        
        let accessToken = null;
        let currentUser = null;

        // --- Helper Functions ---
        const updateResponse = (data, status) => {
            responseEl.textContent = JSON.stringify(data, null, 2);
            responseEl.classList.toggle('text-red-400', status >= 400);
            responseEl.classList.toggle('text-green-400', status < 400);
        };

        const updateStateDisplays = () => {
            accessTokenDisplay.textContent = accessToken || '- Not set -';
            if (currentUser) {
                userIdDisplay.textContent = currentUser.id;
                createdByInput.value = currentUser.id;
                uploadBtn.disabled = false;
                uploadBtn.classList.remove('disabled-btn');
            }
        };
        
        // --- Event Listeners ---

        // 1. Login Form
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(`${userApiUrl.value}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                    credentials: 'include'
                });
                const data = await res.json();
                updateResponse(data, res.status);

                if (res.ok && data.accessToken) {
                    accessToken = data.accessToken;
                    currentUser = data.user;
                    updateStateDisplays();
                }
            } catch (err) {
                updateResponse({ message: 'Network error', error: err.message }, 500);
            }
        });

        // 2. Upload Form
        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!accessToken) {
                updateResponse({ message: 'You must be logged in to upload files.' }, 401);
                return;
            }

            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            if (!file) {
                updateResponse({ message: 'Please select a file to upload.' }, 400);
                return;
            }
            
            // Use FormData for multipart/form-data requests
            const formData = new FormData();
            formData.append('file', file); // The actual file
            // Append other metadata fields from the controller
            formData.append('uniqueId', document.getElementById('upload-uniqueId').value);
            formData.append('projectId', document.getElementById('upload-projectId').value);
            formData.append('createdBy', createdByInput.value);
            formData.append('fileType', document.getElementById('upload-fileType').value);

            try {
                const res = await fetch(`${fileApiUrl.value}/upload`, {
                    method: 'POST',
                    headers: {
                        // DO NOT set Content-Type; the browser sets it automatically for FormData
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: formData,
                });

                const data = await res.json();
                updateResponse(data, res.status);

                if (res.ok) {
                    // Add the new file to the uploads list
                    if (uploadsList.children[0]?.textContent.includes('No files uploaded')) {
                        uploadsList.innerHTML = '';
                    }
                    const li = document.createElement('li');
                    li.className = 'flex justify-between items-center bg-gray-700 p-2 rounded';
                    const fileInfo = data.file;
                    li.innerHTML = `
                        <span>${fileInfo.fileName}</span>
                        <a href="${fileApiUrl.value}/${fileInfo.gridfsId}" target="_blank" class="text-blue-400 hover:underline">Download</a>
                    `;
                    uploadsList.prepend(li);
                }
            } catch (err) {
                updateResponse({ message: 'Network error during upload', error: err.message }, 500);
            }
        });
    </script>
</body>
</html>
